# Publishes this package to npm when a version tag (vX.Y.Z) is pushed.
#
# Authentication is npm trusted publishing: npm accepts the short-lived
# identity GitHub issues to this workflow, so no npm token is needed. Until
# the trusted publisher is registered on npmjs.com for this package, the
# NPM_TOKEN repository secret is used instead; delete that secret afterwards.
# Either way each release carries a provenance statement linking it to this
# repository and commit.
#
# To release: set the new version in package.json, add it to CHANGELOG.md,
# commit, then `git tag vX.Y.Z && git push origin main vX.Y.Z`.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Publish
        # prepublishOnly runs the typecheck and build first.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
